[build]
  publish = "dist"
  command = "npm run build"

# Proxy Arc Raiders API to avoid CORS issues
[[redirects]]
  from = "/api/arc-raiders/*"
  to = "https://metaforge.app/api/arc-raiders/:splat"
  status = 200
  force = true

# SPA redirect (must be last)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "20"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

